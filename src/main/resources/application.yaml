spring:
  application:
    name: scalable-url-shortener

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  base-url: http://localhost:8080
  shortcode:
    multiplier-a: ${SHORTCODE_MULTIPLIER_A}
    multiplier-b: ${SHORTCODE_MULTIPLIER_B}
    multiplier-c: ${SHORTCODE_MULTIPLIER_C}
    offset: ${SHORTCODE_OFFSET}
    block-size: 1000